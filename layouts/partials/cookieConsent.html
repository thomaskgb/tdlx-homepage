{{- $gaID := site.Config.Services.GoogleAnalytics.ID -}}
{{- if and $gaID (hugo.IsProduction | or (eq site.Params.env "production")) }}
<div id="cookie-banner" class="cookie-banner" hidden>
    <p>This site uses Google Analytics to understand how it is used. No analytics cookies are set unless you accept.</p>
    <div class="cookie-banner-actions">
        <button type="button" id="cookie-accept" class="cookie-btn cookie-btn-accept">Accept</button>
        <button type="button" id="cookie-decline" class="cookie-btn">Decline</button>
    </div>
</div>
<script>
    (function () {
        var gaId = {{ $gaID }};
        function loadGA() {
            var s = document.createElement('script');
            s.async = true;
            s.src = 'https://www.googletagmanager.com/gtag/js?id=' + gaId;
            document.head.appendChild(s);
            window.dataLayer = window.dataLayer || [];
            window.gtag = function () { dataLayer.push(arguments); };
            gtag('js', new Date());
            gtag('config', gaId, { anonymize_ip: true });
        }
        var choice = null;
        try { choice = localStorage.getItem('cookie-consent'); } catch (e) { }
        if (choice === 'granted') { loadGA(); return; }
        if (choice === 'denied') { return; }
        var banner = document.getElementById('cookie-banner');
        if (!banner) { return; }
        banner.hidden = false;
        function decide(value) {
            try { localStorage.setItem('cookie-consent', value); } catch (e) { }
            banner.hidden = true;
            if (value === 'granted') { loadGA(); }
        }
        document.getElementById('cookie-accept').addEventListener('click', function () { decide('granted'); });
        document.getElementById('cookie-decline').addEventListener('click', function () { decide('denied'); });
    })();
</script>
{{- end }}
