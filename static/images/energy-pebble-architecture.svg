<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7684"/>
    </marker>
  </defs>

  <!-- Elia -->
  <rect x="20" y="100" width="170" height="70" rx="8" fill="none" stroke="#6b7684" stroke-width="1.5"/>
  <text x="105" y="130" text-anchor="middle" fill="#8b95a3" font-weight="600">Elia grid data</text>
  <text x="105" y="152" text-anchor="middle" fill="#8b95a3" font-size="12">day-ahead prices, 15 min</text>

  <!-- API platform -->
  <rect x="270" y="70" width="220" height="130" rx="8" fill="none" stroke="#5b8dd9" stroke-width="1.5"/>
  <text x="380" y="97" text-anchor="middle" fill="#5b8dd9" font-weight="600">Energy Pebble API</text>
  <text x="380" y="120" text-anchor="middle" fill="#8b95a3" font-size="12">prices to colour codes</text>
  <text x="380" y="140" text-anchor="middle" fill="#8b95a3" font-size="12">web dashboard + admin</text>
  <text x="380" y="160" text-anchor="middle" fill="#8b95a3" font-size="12">signed OTA firmware</text>
  <text x="380" y="180" text-anchor="middle" fill="#8b95a3" font-size="12">FastAPI, Docker</text>

  <!-- Pebble -->
  <rect x="570" y="70" width="170" height="90" rx="8" fill="none" stroke="#4caf7d" stroke-width="1.5"/>
  <text x="655" y="97" text-anchor="middle" fill="#4caf7d" font-weight="600">Pebble device</text>
  <text x="655" y="119" text-anchor="middle" fill="#8b95a3" font-size="12">ESP32 + LED ring</text>
  <text x="655" y="139" text-anchor="middle" fill="#8b95a3" font-size="12">ESPHome firmware</text>
  <!-- LED dots -->
  <circle cx="613" cy="149" r="5" fill="#4caf7d"/>
  <circle cx="633" cy="149" r="5" fill="#4caf7d"/>
  <circle cx="653" cy="149" r="5" fill="#e6b84c"/>
  <circle cx="673" cy="149" r="5" fill="#e0635c"/>
  <circle cx="693" cy="149" r="5" fill="#e0635c"/>

  <!-- Home Assistant -->
  <rect x="570" y="210" width="170" height="60" rx="8" fill="none" stroke="#6b7684" stroke-width="1.5"/>
  <text x="655" y="235" text-anchor="middle" fill="#8b95a3" font-weight="600">Home Assistant</text>
  <text x="655" y="255" text-anchor="middle" fill="#8b95a3" font-size="12">custom integration</text>

  <!-- Arrows -->
  <line x1="190" y1="135" x2="262" y2="135" stroke="#6b7684" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="226" y="125" text-anchor="middle" fill="#8b95a3" font-size="11">fetch</text>

  <line x1="490" y1="115" x2="562" y2="115" stroke="#6b7684" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="526" y="105" text-anchor="middle" fill="#8b95a3" font-size="11">wifi poll</text>
  <line x1="490" y1="150" x2="562" y2="150" stroke="#6b7684" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="4 3"/>
  <text x="526" y="168" text-anchor="middle" fill="#8b95a3" font-size="11">OTA updates</text>

  <path d="M 490 185 Q 540 240 562 240" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="520" y="228" text-anchor="middle" fill="#8b95a3" font-size="11">colour codes</text>
</svg>
