<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7684"/>
    </marker>
  </defs>

  <!-- Internet -->
  <rect x="20" y="120" width="130" height="60" rx="8" fill="none" stroke="#6b7684" stroke-width="1.5"/>
  <text x="85" y="155" text-anchor="middle" fill="#8b95a3" font-weight="600">Internet</text>

  <!-- Traefik -->
  <rect x="230" y="100" width="180" height="100" rx="8" fill="none" stroke="#5b8dd9" stroke-width="1.5"/>
  <text x="320" y="130" text-anchor="middle" fill="#5b8dd9" font-weight="600">Traefik</text>
  <text x="320" y="152" text-anchor="middle" fill="#8b95a3" font-size="12">reverse proxy</text>
  <text x="320" y="172" text-anchor="middle" fill="#8b95a3" font-size="12">Let's Encrypt TLS</text>

  <!-- Services column -->
  <rect x="500" y="20" width="240" height="40" rx="8" fill="none" stroke="#4caf7d" stroke-width="1.5"/>
  <text x="620" y="45" text-anchor="middle" fill="#8b95a3">tdlx.nl · this website</text>

  <rect x="500" y="72" width="240" height="40" rx="8" fill="none" stroke="#6b7684" stroke-width="1.5"/>
  <text x="620" y="97" text-anchor="middle" fill="#8b95a3">energypebble.tdlx.nl</text>

  <rect x="500" y="124" width="240" height="40" rx="8" fill="none" stroke="#6b7684" stroke-width="1.5"/>
  <text x="620" y="149" text-anchor="middle" fill="#8b95a3">monitoring · Grafana</text>

  <rect x="500" y="176" width="240" height="40" rx="8" fill="none" stroke="#6b7684" stroke-width="1.5"/>
  <text x="620" y="201" text-anchor="middle" fill="#8b95a3">ntfy · push notifications</text>

  <rect x="500" y="228" width="240" height="40" rx="8" fill="none" stroke="#6b7684" stroke-width="1.5"/>
  <text x="620" y="253" text-anchor="middle" fill="#8b95a3">Authelia · single sign-on</text>

  <!-- WireGuard + home -->
  <rect x="230" y="250" width="180" height="60" rx="8" fill="none" stroke="#e6b84c" stroke-width="1.5"/>
  <text x="320" y="275" text-anchor="middle" fill="#e6b84c" font-weight="600">WireGuard VPN</text>
  <text x="320" y="295" text-anchor="middle" fill="#8b95a3" font-size="12">tunnel to home server</text>

  <!-- Arrows -->
  <line x1="150" y1="150" x2="222" y2="150" stroke="#6b7684" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="186" y="140" text-anchor="middle" fill="#8b95a3" font-size="11">https</text>

  <line x1="410" y1="120" x2="492" y2="42" stroke="#6b7684" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="410" y1="135" x2="492" y2="93" stroke="#6b7684" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="410" y1="150" x2="492" y2="145" stroke="#6b7684" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="410" y1="165" x2="492" y2="197" stroke="#6b7684" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="410" y1="180" x2="492" y2="248" stroke="#6b7684" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <line x1="320" y1="200" x2="320" y2="242" stroke="#6b7684" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Droplet boundary -->
  <rect x="210" y="6" width="544" height="318" rx="12" fill="none" stroke="#6b7684" stroke-width="1" stroke-dasharray="6 5" opacity="0.6"/>
  <text x="228" y="26" fill="#8b95a3" font-size="11" opacity="0.8">one droplet, Docker Compose</text>
</svg>
