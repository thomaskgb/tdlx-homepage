<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" role="img" aria-label="Four feedback loops around the ledger: Todoist sync every ten minutes, sweep and resolve four times a day, the shift after every sweep, the weekly review">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7684"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e0635c"/>
    </marker>
  </defs>
  <circle cx="215" cy="215" r="46" fill="none" stroke="#e6b84c" stroke-width="2"/>
  <text x="215" y="213" text-anchor="middle" fill="#e6b84c" font-size="13" font-weight="600">the ledger</text>
  <text x="215" y="229" text-anchor="middle" fill="#8b95a3" font-size="10">what I owe</text>
  <circle cx="215" cy="215" r="88" fill="none" stroke="#4fa37a" stroke-width="1.5" stroke-opacity="0.85"/>
  <path d="M 121 220 L 127 209 L 133 220 z" fill="#4fa37a"/>
  <circle cx="237.8" cy="300" r="3.5" fill="#4fa37a"/>
  <line x1="237.8" y1="300" x2="440" y2="300" stroke="#4fa37a" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="450" y="296" text-anchor="start" fill="#4fa37a" font-size="13" font-weight="600">Every 10 minutes: the Todoist sync</text>
  <text x="450" y="313" text-anchor="start" fill="#8b95a3" font-size="12">a tick on the phone closes the row, and back</text>
  <circle cx="215" cy="215" r="128" fill="none" stroke="#e0635c" stroke-width="1.5" stroke-opacity="0.85"/>
  <path d="M 81 220 L 87 209 L 93 220 z" fill="#e0635c"/>
  <circle cx="343.0" cy="215" r="3.5" fill="#e0635c"/>
  <line x1="343.0" y1="215" x2="440" y2="215" stroke="#e0635c" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="450" y="211" text-anchor="start" fill="#e0635c" font-size="13" font-weight="600">Four times a day: sweep and resolve</text>
  <text x="450" y="228" text-anchor="start" fill="#8b95a3" font-size="12">capture what is new, re-read 15 open items,</text>
  <text x="450" y="243" text-anchor="start" fill="#8b95a3" font-size="12">close only on evidence</text>
  <circle cx="215" cy="215" r="168" fill="none" stroke="#5b8dd9" stroke-width="1.5" stroke-opacity="0.85"/>
  <path d="M 41 220 L 47 209 L 53 220 z" fill="#5b8dd9"/>
  <circle cx="356.9" cy="125" r="3.5" fill="#5b8dd9"/>
  <line x1="356.9" y1="125" x2="440" y2="125" stroke="#5b8dd9" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="450" y="121" text-anchor="start" fill="#5b8dd9" font-size="13" font-weight="600">After every sweep: the shift</text>
  <text x="450" y="138" text-anchor="start" fill="#8b95a3" font-size="12">one quiet session per open item,</text>
  <text x="450" y="153" text-anchor="start" fill="#8b95a3" font-size="12">each leaves a draft for me to judge</text>
  <circle cx="215" cy="215" r="208" fill="none" stroke="#9b7fd4" stroke-width="1.5" stroke-opacity="0.85"/>
  <path d="M 1 220 L 7 209 L 13 220 z" fill="#9b7fd4"/>
  <circle cx="327.4" cy="40" r="3.5" fill="#9b7fd4"/>
  <line x1="327.4" y1="40" x2="440" y2="40" stroke="#9b7fd4" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="450" y="36" text-anchor="start" fill="#9b7fd4" font-size="13" font-weight="600">Every week: the review</text>
  <text x="450" y="53" text-anchor="start" fill="#8b95a3" font-size="12">approved, edited and rejected drafts</text>
  <text x="450" y="68" text-anchor="start" fill="#8b95a3" font-size="12">tune the prompt, as a diff in git</text>
</svg>
