<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14">
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7684"/>
    </marker>
  </defs>

  <!-- Thermocouple -->
  <rect x="20" y="90" width="170" height="70" rx="8" fill="none" stroke="#6b7684" stroke-width="1.5"/>
  <text x="105" y="118" text-anchor="middle" fill="#8b95a3" font-weight="600">Thermocouple</text>
  <text x="105" y="140" text-anchor="middle" fill="#8b95a3" font-size="12">MAX31855, actual temp</text>

  <!-- ESP32 PID -->
  <rect x="270" y="80" width="200" height="90" rx="8" fill="none" stroke="#5b8dd9" stroke-width="1.5"/>
  <text x="370" y="108" text-anchor="middle" fill="#5b8dd9" font-weight="600">ESP32-S3 · PID control</text>
  <text x="370" y="130" text-anchor="middle" fill="#8b95a3" font-size="12">setpoint vs measured</text>
  <text x="370" y="150" text-anchor="middle" fill="#8b95a3" font-size="12">autotuned, ESPHome</text>

  <!-- Heater -->
  <rect x="550" y="90" width="190" height="70" rx="8" fill="none" stroke="#e0635c" stroke-width="1.5"/>
  <text x="645" y="118" text-anchor="middle" fill="#e0635c" font-weight="600">Heating element</text>
  <text x="645" y="140" text-anchor="middle" fill="#8b95a3" font-size="12">relay driven</text>

  <!-- Safety -->
  <rect x="270" y="10" width="200" height="44" rx="8" fill="none" stroke="#e6b84c" stroke-width="1.5"/>
  <text x="370" y="28" text-anchor="middle" fill="#e6b84c" font-weight="600" font-size="13">Safety cutoff</text>
  <text x="370" y="45" text-anchor="middle" fill="#8b95a3" font-size="11">over-temp + sensor failure: heater off</text>

  <!-- Home Assistant -->
  <rect x="270" y="200" width="200" height="50" rx="8" fill="none" stroke="#6b7684" stroke-width="1.5"/>
  <text x="370" y="222" text-anchor="middle" fill="#8b95a3" font-weight="600" font-size="13">Home Assistant</text>
  <text x="370" y="240" text-anchor="middle" fill="#8b95a3" font-size="11">setpoint, monitoring, MQTT</text>

  <!-- Arrows -->
  <line x1="190" y1="125" x2="262" y2="125" stroke="#6b7684" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <text x="226" y="115" text-anchor="middle" fill="#8b95a3" font-size="11">measure</text>

  <line x1="470" y1="125" x2="542" y2="125" stroke="#6b7684" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <text x="506" y="115" text-anchor="middle" fill="#8b95a3" font-size="11">drive</text>

  <!-- feedback loop -->
  <path d="M 645 160 Q 645 195 500 195 Q 105 195 105 160" fill="none" stroke="#6b7684" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow3)"/>
  <text x="560" y="188" text-anchor="middle" fill="#8b95a3" font-size="11">oven temperature feedback</text>

  <line x1="370" y1="54" x2="370" y2="72" stroke="#e6b84c" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <line x1="370" y1="200" x2="370" y2="178" stroke="#6b7684" stroke-width="1.5" marker-end="url(#arrow3)"/>
</svg>
