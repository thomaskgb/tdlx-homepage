<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 190" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" role="img" aria-label="Default due dates: one working day for requests, questions and reviews, three for commitments, five for the rest, ten for undated to-dos">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7684"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e0635c"/>
    </marker>
  </defs>
  <text x="236" y="37" text-anchor="end" fill="#8b95a3" font-size="13">a request, a question, a review</text>
  <rect x="250" y="20" width="36" height="24" rx="4" fill="#5b8dd9" fill-opacity="0.41"/>
  <text x="294" y="37" text-anchor="start" fill="#8b95a3" font-size="12">1 working day</text>
  <text x="236" y="75" text-anchor="end" fill="#8b95a3" font-size="13">a commitment</text>
  <rect x="250" y="58" width="108" height="24" rx="4" fill="#5b8dd9" fill-opacity="0.54"/>
  <text x="366" y="75" text-anchor="start" fill="#8b95a3" font-size="12">3 working days</text>
  <text x="236" y="113" text-anchor="end" fill="#8b95a3" font-size="13">anything else</text>
  <rect x="250" y="96" width="180" height="24" rx="4" fill="#5b8dd9" fill-opacity="0.68"/>
  <text x="438" y="113" text-anchor="start" fill="#8b95a3" font-size="12">5 working days</text>
  <text x="236" y="151" text-anchor="end" fill="#8b95a3" font-size="13">a to-do without a date</text>
  <rect x="250" y="134" width="360" height="24" rx="4" fill="#5b8dd9" fill-opacity="1.00"/>
  <text x="618" y="151" text-anchor="start" fill="#8b95a3" font-size="12">10 working days</text>
  <line x1="250" y1="14" x2="250" y2="168" stroke="#6b7684" stroke-width="1"/>
  <text x="250" y="184" text-anchor="middle" fill="#8b95a3" font-size="10">captured</text>
</svg>
