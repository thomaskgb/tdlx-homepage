<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 335" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" role="img" aria-label="Item states: inbox, open, waiting, being checked, done and dropped, with the transitions between them">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7684"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e0635c"/>
    </marker>
  </defs>
  <rect x="20" y="120" width="125" height="48" rx="8" fill="none" stroke="#e6b84c" stroke-width="1.5"/>
  <text x="82.5" y="141" text-anchor="middle" fill="#e6b84c" font-weight="600" font-size="13">Inbox</text>
  <text x="82.5" y="159" text-anchor="middle" fill="#8b95a3" font-size="11">captured, not triaged</text>
  <rect x="215" y="120" width="125" height="48" rx="8" fill="none" stroke="#5b8dd9" stroke-width="1.5"/>
  <text x="277.5" y="141" text-anchor="middle" fill="#5b8dd9" font-weight="600" font-size="13">Open</text>
  <text x="277.5" y="159" text-anchor="middle" fill="#8b95a3" font-size="11">the next move is mine</text>
  <rect x="215" y="250" width="125" height="48" rx="8" fill="none" stroke="#9b7fd4" stroke-width="1.5"/>
  <text x="277.5" y="271" text-anchor="middle" fill="#9b7fd4" font-weight="600" font-size="13">Waiting</text>
  <text x="277.5" y="289" text-anchor="middle" fill="#8b95a3" font-size="11">the next move is theirs</text>
  <rect x="410" y="120" width="125" height="48" rx="8" fill="none" stroke="#6b7684" stroke-width="1.5"/>
  <text x="472.5" y="141" text-anchor="middle" fill="#8b95a3" font-weight="600" font-size="13">Being checked</text>
  <text x="472.5" y="159" text-anchor="middle" fill="#8b95a3" font-size="10">a Done is a claim</text>
  <rect x="615" y="56" width="125" height="48" rx="8" fill="none" stroke="#4fa37a" stroke-width="1.5"/>
  <text x="677.5" y="77" text-anchor="middle" fill="#4fa37a" font-weight="600" font-size="13">Done</text>
  <text x="677.5" y="95" text-anchor="middle" fill="#8b95a3" font-size="11">delivered</text>
  <rect x="615" y="184" width="125" height="48" rx="8" fill="none" stroke="#e0635c" stroke-width="1.5"/>
  <text x="677.5" y="205" text-anchor="middle" fill="#e0635c" font-weight="600" font-size="13">Dropped</text>
  <text x="677.5" y="223" text-anchor="middle" fill="#8b95a3" font-size="11">let go, on purpose</text>
  <line x1="145" y1="144" x2="211" y2="144" stroke="#6b7684" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="178" y="136" text-anchor="middle" fill="#8b95a3" font-size="10">triage</text>
  <line x1="262" y1="168" x2="262" y2="246" stroke="#6b7684" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="256" y="212" text-anchor="end" fill="#8b95a3" font-size="10">handed off</text>
  <line x1="292" y1="250" x2="292" y2="172" stroke="#6b7684" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="298" y="212" text-anchor="start" fill="#8b95a3" font-size="10">answered</text>
  <line x1="340" y1="144" x2="406" y2="144" stroke="#6b7684" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="373" y="136" text-anchor="middle" fill="#8b95a3" font-size="10">I close it</text>
  <line x1="535" y1="132" x2="611" y2="86" stroke="#6b7684" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="556" y="96" text-anchor="end" fill="#8b95a3" font-size="10">evidence found</text>
  <line x1="535" y1="156" x2="611" y2="202" stroke="#6b7684" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="560" y="196" text-anchor="end" fill="#8b95a3" font-size="10">reason given</text>
  <path d="M 455 168 L 455 200 L 325 200 L 325 172" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="392" y="216" text-anchor="start" fill="#8b95a3" font-size="10">no evidence: stays open</text>
  <path d="M 82 168 L 82 318 L 677 318 L 677 236" fill="none" stroke="#e0635c" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr-red)"/>
  <text x="400" y="312" text-anchor="middle" fill="#e0635c" font-size="10">Won't do, never without a reason</text>
  <path d="M 245 120 C 240 72, 315 72, 312 116" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="278" y="50" text-anchor="middle" fill="#8b95a3" font-size="10">Set date: every move is a push.</text>
  <text x="278" y="64" text-anchor="middle" fill="#e0635c" font-size="10">Two pushes and the item is drifting.</text>
</svg>
